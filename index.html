<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pizza Rush</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%232f6b4f'/><text x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' fill='%23ffffff'>P</text></svg>"
    />
  </head>
  <body>
    <header>
      <h1>Pizza Rush</h1>
      <p class="sous-titre">Trois coursiers, un quartier, et des pizzas qui refroidissent.</p>
    </header>

    <div id="score" class="score"></div>

    <main>
      <section class="panneau carte-panneau">
        <h2>Le quartier <span id="nom-quartier" class="discret"></span></h2>
        <div id="carte" class="carte"></div>
        <div class="commandes-barre">
          <button id="jouer" type="button" class="principal">Jouer</button>
          <button id="un-tour" type="button">Un tour</button>
          <button id="rejouer" type="button">Rejouer</button>
        </div>
        <p class="legende">
          <span><span class="pastille pizzeria">P</span>pizzeria</span>
          <span><span class="pastille coursier">V</span>coursier</span>
          <span><span class="pastille client">!</span>client qui attend</span>
          <span><span class="pastille mur"></span>immeuble</span>
        </p>
      </section>

      <section class="panneau">
        <h2>Les coursiers</h2>
        <ul id="coursiers" class="liste coursiers"></ul>

        <h2>En attente</h2>
        <ul id="commandes" class="liste commandes"></ul>
      </section>
    </main>

    <section class="panneau journal-panneau">
      <h2>Le service</h2>
      <div id="journal" class="journal"></div>
    </section>

    <footer><a href="tests.html">Lancer les tests</a> et <a href="SUJET.md">lire le sujet</a></footer>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
