<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pizza Rush, les tests</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%232f6b4f'/><text x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' fill='%23ffffff'>T</text></svg>"
    />
  </head>
  <body>
    <header>
      <h1>Les tests</h1>
      <p class="sous-titre">Le premier test rouge est votre prochaine etape.</p>
    </header>

    <section class="panneau">
      <div id="bilan" class="bilan">Chargement en cours.</div>
      <div id="resultats" class="resultats"></div>
    </section>

    <footer><a href="index.html">Retour au jeu</a></footer>

    <script type="module">
      import { lancer, decrireErreur } from "./tests/mini.js";
      import "./tests/test_1_modeles.js";
      import "./tests/test_2_algos.js";
      import "./tests/test_3_jeu.js";
      import "./tests/test_4_les_votres.js";

      const bilan = document.querySelector("#bilan");
      const resultats = document.querySelector("#resultats");
      let derniereSuite = null;

      const rapport = await lancer((r) => {
        if (r.suite !== derniereSuite) {
          const titre = document.createElement("div");
          titre.className = "suite-titre";
          titre.textContent = r.suite;
          resultats.append(titre);
          derniereSuite = r.suite;
        }
        const ligne = document.createElement("div");
        ligne.className = "test " + (r.ok ? "ok" : "ko");
        const etat = document.createElement("span");
        etat.className = "etat";
        etat.textContent = r.ok ? "ok" : "KO";
        ligne.append(etat, document.createTextNode(r.nom));
        if (!r.ok) {
          const message = document.createElement("span");
          message.className = "message";
          message.textContent = decrireErreur(r.erreur);
          ligne.append(message);
        }
        resultats.append(ligne);
      });

      const tous = rapport.flatMap((s) => s.resultats);
      const rates = tous.filter((r) => !r.ok);
      if (rates.length === 0) {
        bilan.className = "bilan tout-vert";
        bilan.textContent = `${tous.length} tests, tout est vert.`;
      } else {
        bilan.className = "bilan des-rouges";
        bilan.textContent = `${rates.length} rate(s) sur ${tous.length}. Prochaine etape : ${rates[0].nom}`;
      }
    </script>
  </body>
</html>
